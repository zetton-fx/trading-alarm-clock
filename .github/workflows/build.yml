name: Build Trading Alarm Clock

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Build Electron App
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_IDENTITY_AUTO_DISCOVERY }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trading-alarm-clock-${{ matrix.os }}-${{ github.sha }}
        path: |
          release/*.exe
          release/*.dmg
          release/*.AppImage
        if-no-files-found: warn
        retention-days: 30

  comment-pr:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Comment PR with download links
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const prNumber = context.issue.number;
          const runId = context.runId;
          
          const comment = `## ビルド完了！
          
          以下からバイナリをダウンロードできます：
          
          - [Windows版をダウンロード](https://github.com/${owner}/${repo}/actions/runs/${runId})
          - [macOS版をダウンロード](https://github.com/${owner}/${repo}/actions/runs/${runId})
          
          Actions画面の「Artifacts」セクションからダウンロードしてください。
          
          > ※ アーティファクトは30日間保存されます`;
          
          github.rest.issues.createComment({
            owner,
            repo,
            issue_number: prNumber,
            body: comment
          }); 